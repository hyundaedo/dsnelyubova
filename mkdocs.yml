site_name: Daria Test Site
use_directory_urls: true  
theme:
  name: material
  language: ru
  palette:
    # Темная база (Slate)
    - scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Перейти на светлую тему
    # Светлая база (Default)
    - scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Перейти на темную тему
  features:
    - navigation.sections
    - content.code.copy
    - content.tooltips

extra:
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/your_username
    - icon: fontawesome/brands/github
      link: https://github.com/your_username

# Кастомные цвета (Персиковый акцент)
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.tilde
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true # Эта настройка осталась внутри tabbed
  - pymdownx.emoji: # Новое отдельное расширение для иконок
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
nav:                                      #расположение всех ваших файлов
  - Пояснения к тестовому заданию: index.md 
  - Создание агента: just_ai.md
