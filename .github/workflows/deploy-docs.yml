name: Deploy MkDocs site # Имя workflow

on:
  push:
    branches:
      - main # Запускать при пуше в ветку main

permissions:
  contents: write # Разрешить запись в репозиторий для деплоя

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Забираем код из репозитория
      - uses: actions/checkout@v4

      # 2. Настраиваем Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. Устанавливаем зависимости (mkdocs и плагины)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material
          # Если у вас есть файл requirements.txt, добавьте строку:
          # pip install -r requirements.txt

      # 4. Собираем статический сайт
      - name: Build site
        run: mkdocs build

      # 5. Публикуем на GitHub Pages
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site